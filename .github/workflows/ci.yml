name: CampusOne ERP CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  verify:
    name: Build, Lint & Automated Verification Suites
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5433/postgres"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5433/postgres"
      JWT_SECRET: "mZp12XICGsmUbvvn7Kf9OcmSv2uq572AeuL2OSpfsrUXiDbBBJXSZTX7ppfOc37u"
      PORT: 3000
      NODE_ENV: "test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Deploy Database Migrations
        run: |
          cd backend
          npx prisma migrate deploy

      - name: Seed Initial Data
        run: |
          cd backend
          npx ts-node prisma/seed.ts
          node scripts/seed_p1_4_master_data.js
          node scripts/seed_p2_backfill.js

      - name: Monorepo Typecheck & Build
        run: npm run build

      - name: Monorepo Linter
        run: npm run lint

      - name: Run Phase 1 Foundation Migration Validation
        run: |
          cd backend
          node scripts/validate_p1_migration.js

      - name: Run Phase 1.3 Identity & Security Validation
        run: |
          cd backend
          node scripts/validate_p1_3_migration.js

      - name: Run Phase 1.4 Master-Data Rehearsal Validation
        run: |
          cd backend
          node scripts/validate_p1_4_rehearsal.js

      - name: Run Phase 1 Security Hardening & IDOR Validation
        run: |
          cd backend
          node scripts/validate_phase1_security.js

      - name: Run Phase 2 Lifecycle & Grade Correction Rehearsal
        run: |
          cd backend
          node scripts/validate_p2_rehearsal.js

      - name: Run Phase 2.9 Modern Auth & Hardening Validation
        run: |
          cd backend
          node scripts/validate_p2_9_auth.js

      - name: Run Master Remediation Full Lifecycle Verification
        run: |
          cd backend
          node scripts/validate_master_remediation.js
